services:
  - type: web
    name: ecobot
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    disk:
      name: ecobot-data
      mountPath: /app/.data
      sizeGB: 1
